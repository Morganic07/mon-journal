name: 04b · Écoute des push

# Ce workflow ne fait rien d'utile : il sert de témoin. Il se déclenche sur
# les push venus d'un humain, et reste muet sur ceux émis par un workflow.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tracer:
    runs-on: ubuntu-latest
    steps:
      - name: Signaler le push entendu
        env:
          AUTEUR: ${{ github.event.head_commit.author.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          # Les barres verticales d'un message de commit casseraient le
          # tableau markdown, et seule la première ligne nous intéresse.
          titre=$(printf '%s' "$MESSAGE" | head -n 1 | tr '|' '/')
          {
            echo "### Push entendu"
            echo
            echo "| | |"
            echo "|---|---|"
            printf '| commit | `%s` |\n' "${SHA:0:12}"
            printf '| auteur | %s |\n' "$AUTEUR"
            printf '| message | %s |\n' "$titre"
            echo
            echo "L'auteur ci-dessus est celui **inscrit dans le commit**, et"
            echo "il ne dit rien de qui a poussé. Les commits automatiques de"
            echo "ce dépôt portent eux aussi le profil du compte."
            echo
            echo "Ce qui décide, c'est l'émetteur du push : si ce run existe,"
            echo "c'est qu'un humain a poussé. Un push émis avec le jeton d'un"
            echo "workflow ne déclenche rien, quel que soit l'auteur inscrit."
          } >> "$GITHUB_STEP_SUMMARY"
